plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.ccs.poketstate'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.ccs.poketstate"
        minSdk 30
        targetSdk 37
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing reads secrets from environment variables, never from source files.
    // POKET_KEYSTORE, POKET_KEYSTORE_PASSWORD, POKET_KEY_ALIAS, POKET_KEY_PASSWORD
    signingConfigs {
        release {
            if (System.getenv("POKET_KEYSTORE")) {
                storeFile file(System.getenv("POKET_KEYSTORE"))
                storePassword System.getenv("POKET_KEYSTORE_PASSWORD")
                keyAlias System.getenv("POKET_KEY_ALIAS")
                keyPassword System.getenv("POKET_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("POKET_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    testImplementation libs.junit
}
